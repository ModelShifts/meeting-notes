# 合成会议脚本，内容均为虚构。
title: 设计评审
language: zh
voices: {S1: 6, S2: 62}   # Kokoro v1.1 speaker ids: zf_004 (female), zm_013 (male)
turns:
  - [S1, "大家好，今天我们评审一下新版设置页面的设计稿。"]
  - [S2, "我先说一下。现在的设置项太多了，用户很难找到通知开关。"]
  - [S1, "同意。我们把通知相关的选项放到第一屏，其他高级选项折叠起来。"]
  - [S2, "好，这样改动不大。我下周二之前把新的交互稿发给大家。"]
  - [S1, "另外，深色模式下有几个按钮的对比度不够。"]
  - [S2, "这个我也注意到了。你能不能整理一份需要调整的颜色清单？"]
  - [S1, "可以，我周四之前整理好颜色清单。"]
  - [S2, "还有，开发那边问我们什么时候能定稿。"]
  - [S1, "我们定在下周五定稿。定稿之后，请测试团队在两周内完成可用性测试。"]
  - [S2, "好的，那就这么定了。"]
action_items:
  - {owner: S2, task: "把新的交互稿发给大家", due: "下周二", keywords: [交互稿, 交互]}
  - {owner: S1, task: "整理需要调整的颜色清单", due: "周四", keywords: [颜色, 色彩]}
  - {owner: 测试团队, task: "完成可用性测试", due: "定稿后两周内", keywords: [可用性测试]}
decisions:
  - "通知相关选项放到第一屏，高级选项折叠。"
  - "下周五定稿。"
