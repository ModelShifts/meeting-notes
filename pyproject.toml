[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-notes"
version = "0.0.1"
description = "Turn a meeting recording in English, Chinese or both into a transcript, summary and action items."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Modelshifts", email = "info@modelshifts.com" }]
dependencies = ["pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
api = ["openai>=1.40"]
hf = ["transformers>=4.45", "pyannote.audio>=3.1", "torch>=2.3"]

[project.urls]
Homepage = "https://modelshifts.com/work"
Repository = "https://github.com/ModelShifts/meeting-notes"

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_notes"]
