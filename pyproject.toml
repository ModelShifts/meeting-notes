[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-notes"
version = "0.1.0"
description = "Turn a meeting recording in English, Chinese or both into a transcript, summary and action items."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Modelshifts", email = "info@modelshifts.com" }]
dependencies = [
  "pydantic>=2",
  "numpy>=1.26",
  "python-dotenv>=1",
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12",
  "opencc-python-reimplemented>=0.1.7",
  "json-repair>=0.30",
]

[project.optional-dependencies]
api = ["openai>=1.40"]
hf = ["transformers>=4.56", "torch>=2.3", "accelerate>=0.33"]
pyannote = ["pyannote.audio>=3.3"]
demo = ["gradio>=5"]
samples = ["pyyaml>=6"]
eval = ["jiwer>=3.1", "pyyaml>=6"]
dev = ["pytest>=8", "openai>=1.40", "pyyaml>=6", "jiwer>=3.1"]

[project.urls]
Homepage = "https://modelshifts.com/work"
Repository = "https://github.com/ModelShifts/meeting-notes"

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
